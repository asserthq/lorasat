[package]
authors = ["asserthq <sanya2003ogorodov@gmail.com>"]
name = "sat-drivers"
edition = "2024"
version = "0.1.0"

[lib]

[features]
default = ["defmt"]
defmt = [
    "defmt-or-log/defmt",
    "sat_core/defmt",
    "sat_csp/defmt",
    "embassy-time/defmt",
    "embassy-sync/defmt",
    "embassy-futures/defmt",
    "embedded-hal/defmt-03",
    "embedded-hal-async/defmt-03",
    "embedded-hal-bus/defmt-03",
]
log = ["dep:log", "defmt-or-log/log", "sat_core/log", "sat_csp/log"]
legacy-protocol = []

[dependencies]
sat_core = { package = "sat-core", path = "../core", default-features = false }
sat_csp = { package = "sat-csp", path = "../csp", default-features = false }

defmt = "1.0.1"
log = { version = "0.4", optional = true }
defmt-or-log = { version = "0.2.3", default-features = false }
embassy-time = "0.5.1"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-hal-bus = "0.3.0"
lora-phy = "3.0.1"
serde = { version = "1.0.229", default-features = false,  features = ["derive"] }
postcard = { version = "1.1.3", default-features = false }
heapless = { version = "0.9.3", features = ["serde"] }
embedded-io-async = "0.7"
drv8833-driver = { git = "https://github.com/Anryurev/drv8833-nostd.git", branch = "main" }
embedded-storage-async = "0.4.1"
sequential-storage = { version = "=8.0.2", default-features = false, features = ["postcard"] }
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
nalgebra = { version = "0.35.0", default-features = false, features = ["libm"] }
veml6030 = { version = "1.0.0", features = ["async"] }
mmc5983_rs = { version = "0.0.1", features = ["async"] }

[dev-dependencies]
futures = { version = "0.3", features = ["executor"] }
critical-section = { version = "1.2.0", features = ["std"] }
