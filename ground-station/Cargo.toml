[package]
authors = ["asserthq <sanya2003ogorodov@gmail.com>"]
name = "ground-station"
edition = "2024"
version = "0.1.0"

[features]
default = ["log"]
defmt = [
    "dep:defmt",
    "defmt-or-log/defmt",
    "sat_core/defmt",
    "sat_drivers/defmt",
    "sat_subsystems/defmt",
]
log = [
    "dep:log",
    "defmt-or-log/log",
    "sat_core/log",
    "sat_drivers/log",
    "sat_subsystems/log",
]

[dependencies]
sat_core = { package = "sat-core", path = "../core", default-features = false }
sat_drivers = { package = "sat-drivers", path = "../drivers", default-features = false }
sat_subsystems = { package = "sat-subsystems", path = "../subsystems", default-features = false }

embassy-futures = "0.1.2"
embassy-time = { version = "0.5.1", features = ["std", "generic-queue-8"] }
tokio = { version = "1", features = ["net", "time", "rt", "macros", "io-util", "sync"] }
log = { version = "0.4", optional = true }
defmt-or-log = { version = "0.2.3", default-features = false }
env_logger = "0.11"
serde = { version = "1.0.229", default-features = false,  features = ["derive"] }
postcard = { version = "1.1.3", default-features = false }
heapless = { version = "0.9.3", features = ["serde"] }
defmt = { version = "1.0.1", optional = true }
