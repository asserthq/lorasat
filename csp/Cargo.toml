[package]
name = "sat-csp"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Small no_std CSP v2 protocol implementation"

[lib]

[dependencies]
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
futures = { version = "0.3", features = ["executor"] }
