[package]
name = "sat-csp"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Small no_std CSP v2 protocol implementation"

[lib]

[features]
default = ["defmt"]
defmt = ["dep:defmt", "embassy-futures/defmt", "embassy-sync/defmt"]
log = ["dep:log"]

[dependencies]
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
defmt = { version = "1.0.1", optional = true }
log = { version = "0.4", optional = true }

[dev-dependencies]
test_utils = { package = "test-utils", path = "../test-utils", default-features = false, features = ["std"] }

critical-section = { version = "1.2.0", features = ["std"] }
defmt = { version = "1.0.1", features = ["unstable-test"] }
futures = { version = "0.3", features = ["executor"] }
tokio = { version = "1", features = ["macros", "rt", "time"] }
